<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 法文文化翻譯官 | 跨領域 AI 專題</title>
    <!-- 引入 Tailwind CSS 讓介面瞬間變得很現代、有質感 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-900 text-white shadow-md py-6 px-8">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    <span>🇫🇷</span> AI 法文文化翻譯官
                </h1>
                <p class="text-indigo-200 text-sm mt-1">翻譯文字容易，理解文化難嗎？帶你避開法文溝通中的文化黑洞與社交地雷。</p>
            </div>
            <div class="mt-4 md:mt-0 bg-indigo-800 px-4 py-2 rounded-lg text-xs border border-indigo-700">
                🏆 2026 全國 AI 專題創意競賽 (跨領域組)
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto p-6 md:p-8 space-y-6">

        <!-- 控制台與輸入卡片 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">🎯 選擇對話與社交場景：</label>
                    <select id="scenarioSelect" class="w-auto px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="日常社交與聚會">日常社交與聚會</option>
                        <option value="商業正式交流">商業正式交流</option>
                        <option value="餐廳與日常購物">餐廳與日常購物</option>
                        <option value="職場與面試">職場與面試</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">⚡ 快速測試範例：</label>
                    <button onclick="fillExample()" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-3 py-2 rounded-lg hover:bg-indigo-100 transition font-medium">
                        ✨ 帶入範例：「我今天不想去參加派對，你自己去吧。」
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">請輸入你想翻譯的中文句子或直白法文：</label>
                <textarea id="userInput" rows="3" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700" placeholder="例如：我不想去、我要這個、你好嗎..."></textarea>
            </div>

            <button onclick="analyzeText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                <span>🚀 啟動 AI 文化深度解析</span>
            </button>
        </div>

        <!-- 輸出結果面板 (預設隱藏) -->
        <div id="resultPanel" class="hidden space-y-6">
            
            <!-- 雙欄對比 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 通道 A -->
                <div class="bg-red-50 border border-red-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 text-red-700 font-bold text-lg mb-3">
                            <span>❌</span> 通道 A：傳統直譯結果
                        </div>
                        <div id="literalText" class="text-red-900 bg-white p-4 rounded-xl border border-red-100 mb-4 text-base font-medium"></div>
                    </div>
                    <p class="text-xs text-red-600 bg-red-100/60 p-2.5 rounded-lg">
                        💡 <b>缺點說明：</b> 生硬、缺乏當地社交脈絡，在法國人耳中聽起來容易引起誤會或不禮貌。
                    </p>
                </div>

                <!-- 通道 B -->
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 text-emerald-700 font-bold text-lg mb-3">
                            <span>🏆</span> 通道 B：AI 文化翻譯官解析
                        </div>
                        <div id="culturalText" class="text-emerald-900 bg-white p-4 rounded-xl border border-emerald-100 mb-4 text-lg font-bold"></div>
                        
                        <!-- 語音朗讀按鈕 -->
                        <div class="mb-4">
                            <button onclick="speakFrench()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm">
                                <span>🔊</span> 點擊聆聽道地法文發音
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-emerald-100/60 p-3 rounded-lg text-sm">
                        <span class="text-emerald-800 font-semibold">⚠️ 社交踩雷風險指數：</span>
                        <span id="riskBadge" class="px-3 py-1 bg-amber-500 text-white rounded-full text-xs font-bold">中度風險</span>
                    </div>
                </div>
            </div>

            <!-- RAG 深度文化解析 -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-3">
                <h3 class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <span>📖</span> 深度文化與潛台詞解析 (RAG 知識庫支援)
                </h3>
                <div id="analysisText" class="text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed text-sm"></div>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-6 text-slate-400 text-xs">
        <p>2026 全國 AI 專題創意競賽 | 跨領域組參賽作品</p>
    </footer>

    <!-- JavaScript 智慧對應邏輯 -->
    <script>
        // 內建的示範知識庫 (法文系隊友後續可以直接在這裡擴充或改成從 CSV 讀取)
        const knowledgeBase = [
            {
                keywords: ["不要", "不想", "派對", "去"],
                scenario: "日常社交與聚會",
                literal: "Je ne veux pas y aller. (直譯：我不想去那裡。語氣強烈且像在生氣)",
                cultural: "Ça ne me dit rien. / Une prochaine fois !",
                risk: "高風險雷區",
                analysis: "直接說 'Je ne veux pas' 在法文中語氣過於強烈，容易被解讀為具有敵意或拒人於千里之外。法國人習慣用委婉的慣用語如 'Ça ne me dit rien'（這對我沒什麼吸引力）或 'Une prochaine fois !'（下次吧！）來既拒絕又給彼此台階下。"
            },
            {
                keywords: ["你好", "我是", "初次"],
                scenario: "日常社交與聚會",
                literal: "Bonjour, je suis [名字] (直接用 tu 稱呼對方)",
                cultural: "Bonjour, enchanté(e). (務必使用 Vous)",
                risk: "高風險雷區",
                analysis: "在法國社交場合中，對初次見面、長輩或不熟的人絕對不能直接使用 'tu'（你），必須使用 'vous'（您）。誤用 tu 會被法國人視為極度傲慢與缺乏教養。"
            },
            {
                keywords: ["我要", "這個", "點餐", "餐廳"],
                scenario: "餐廳與日常購物",
                literal: "Je veux ça. (直譯：我想要這個。語氣像在大聲命令)",
                cultural: "Je vais prendre... s'il vous plaît.",
                risk: "中度風險",
                analysis: "法式餐廳點餐非常重視禮貌。直接說 'Je veux'（我想要）是非常不禮貌的命令句。法國人習慣使用未來式 'Je vais prendre...'（我將選擇...）並一定要加上 's'利' s'il vous plaît'（請）。"
            },
            {
                keywords: ["好吃", "讚賞", "食物"],
                scenario: "餐廳與日常購物",
                literal: "C'est bon. (直譯：這很好吃/這不錯)",
                cultural: "C'est un véritable délice.",
                risk: "低風險",
                analysis: "法國人對美食有極高的品味與講究。單純說 'c'est bon' 聽起來很敷衍（像在對小孩子說話）。使用 'délice' 或讚嘆食物的烹調細節，能讓法國友人感受到你的誠意與品味。"
            },
            {
                keywords: ["幫忙", "請求"],
                scenario: "職場與面試",
                literal: " Aide-moi. (直譯：幫我！)",
                cultural: "Oseriez-vous me rendre service, s'il vous plaît ?",
                risk: "高風險雷區",
                analysis: "法文中請求他人協助時，很少直接使用命令句。通常會使用條件式（如 Oseriez-vous...）或委婉的請求句型，並搭配眼神接觸與適當的尊稱。"
            }
        ];

        function fillExample() {
            document.getElementById('userInput').value = "我今天不想去參加派對，你自己去吧。";
            document.getElementById('scenarioSelect').value = "日常社交與聚會";
        }

        let currentFrenchText = "";

        function analyzeText() {
            const input = document.getElementById('userInput').value.trim();
            const scenario = document.getElementById('scenarioSelect').value;
            
            if(!input) {
                alert("請先輸入想要翻譯的內容！");
                return;
            }

            // 顯示結果面板
            document.getElementById('resultPanel').classList.remove('hidden');

            // 智慧比對知識庫，若找不到則給予通用的智慧模擬解析
            let matched = knowledgeBase.find(item => 
                input.split('').some(char => item.keywords.includes(char))
            );

            if (!matched) {
                matched = {
                    literal: "Je traduire ça directement. (字面直譯可能忽略了法文的語意情境)",
                    cultural: "Permettez-moi m'exprimer autrement, s'il vous plaît.",
                    risk: "中度風險",
                    analysis: `在「${scenario}」情境下，這句話雖然字面上可以被理解，但在法國在地的社交禮儀中，建議注意動詞的選擇與委婉語氣（例如適時使用主動態轉被動態，或是加入尊稱 Vous），以避免觸及法國人對社交禮節的敏感神經。`
                };
            }

            // 填入畫面
            document.getElementById('literalText').innerText = matched.literal;
            document.getElementById('culturalText').innerText = matched.cultural;
            document.getElementById('analysisText').innerText = matched.analysis;
            
            // 儲存當前法文供語音朗讀使用
            currentFrenchText = matched.cultural.split('/')[0].trim();

            // 設定風險標籤顏色
            const riskBadge = document.getElementById('riskBadge');
            riskBadge.innerText = matched.risk;
            if(matched.risk.includes("高")) {
                riskBadge.className = "px-3 py-1 bg-red-600 text-white rounded-full text-xs font-bold";
            } else if(matched.risk.includes("中")) {
                riskBadge.className = "px-3 py-1 bg-amber-500 text-white rounded-full text-xs font-bold";
            } else {
                riskBadge.className = "px-3 py-1 bg-emerald-600 text-white rounded-full text-xs font-bold";
            }

            // 平滑捲動到結果區
            document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth' });
        }

        // 瀏覽器內建的 Web Speech API 朗讀法文（完全免安裝、免 API Key）
        function speakFrench() {
            if (!currentFrenchText) return;
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentFrenchText);
                utterance.lang = 'fr-FR'; // 設定為法國法文發音
                utterance.rate = 0.9; // 稍微放慢語速，方便聆聽
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音朗讀功能，建議使用 Chrome 或 Edge！");
            }
        }
    </script>
</body>
</html>
